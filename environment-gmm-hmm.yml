# Conda environment of the GMM-HMM baseline (python -m huasr.gmm_hmm).
#
#   conda env create -f environment-gmm-hmm.yml
#   conda activate huasr-gmm-hmm
#
# The versions below are the ones that `conda create -c conda-forge montreal-forced-aligner=3.4.3`
# installed for the run in results/baselines/gmm-hmm-mfa/ (Windows, win-64):
#
#   montreal-forced-aligner 3.4.3     pyhd8ed1ab_1
#   kaldi                   5.5.1172  cpu_hf03c2bf_5
#   kalpy                   0.10.5    py313hf069bd2_0
#   openfst                 1.8.4     hc790b64_1
#   ngram                   1.3.17    hc790b64_0
#   python                  3.13.18
#
# The hash in a build name differs between platforms, so Kaldi is pinned to what the platforms
# share: the CPU build with build number 5 (on linux-64 that is cpu_h5f874f2_5).
name: huasr-gmm-hmm
channels:
  - conda-forge
dependencies:
  - python=3.13
  - montreal-forced-aligner=3.4.3
  - kaldi=5.5.1172=cpu_*_5
  - kalpy=0.10.5
  - openfst=1.8.4
  - ngram=1.3.17
