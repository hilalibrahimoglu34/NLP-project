[build-system]
requires = ["setuptools==78.1.0"]
build-backend = "setuptools.build_meta"

[project]
name = "huasr"
version = "0.1.0"
description = "Hungarian automatic speech recognition: data subset, scoring policy and metrics"
requires-python = ">=3.12"

[tool.setuptools.packages.find]
where = ["src"]
